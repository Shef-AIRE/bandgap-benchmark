DATASET:
  TRAIN: 'data/fine_tune/train_data_50.json'
  VAL: 'data/fine_tune/test_data.json'

MODEL:
  NAME: "linear_regression"
  PRETRAINED_MODEL_PATH: ""
  INIT_FILE: "cif_file/atom_init.json"
  CIF_FOLDER: "cif_file"
  MAX_NBRS: 12
  RADIUS: 8.0
  HYPERPARAMS:
    SEARCH: grid
    fit_intercept: [True, False]
    positive: [True, False]

SOLVER:
  SEED: 42
  NUM_FOLDS: 10
  EPOCHS: 1
  NUM_RUNS: 1
  RANDOMIZE: False

LOGGING:
  LOG_DIR: "saved_models"
  LOG_DIR_NAME: "train_from_scratch/linear_regression_50"
