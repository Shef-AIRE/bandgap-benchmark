DATASET:
  TRAIN: 'data/fine_tune/train_data_25.json'
  VAL: 'data/fine_tune/test_data.json'

MODEL:
  NAME: 'cgcnn'
  PRETRAINED_MODEL_PATH: 'saved_models/cgcnn/best.ckpt'
  INIT_FILE: 'cif_file/atom_init.json'
  CIF_FOLDER: "cif_file"

SOLVER:
  LR: 0.001
  NUM_FOLDS: 10
  EPOCHS: 100
  NUM_RUNS: 1

LOGGING:
  LOG_DIR: "saved_models"
  LOG_DIR_NAME: "fine_tune_data/cgcnn_25"
