DATASET:
  TRAIN: ''
  VAL: ''
  PREDEFINED_SPLIT: true
  SPLIT_GLOB: data/split_by_category/*.train.json
MODEL:
  NAME: random_forest
  PRETRAINED_MODEL_PATH: ''
  INIT_FILE: cif_file/atom_init.json
  CIF_FOLDER: cif_file
  HYPERPARAMS:
    SEARCH: grid
    n_estimators:
    - 200
    - 400
    - 800
    max_depth:
