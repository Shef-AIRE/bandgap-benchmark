    - 4
    - 8
    min_samples_leaf:
    - 1
    - 2
    - 4
SOLVER:
  NUM_FOLDS: 10
  EPOCHS: 100
LOGGING:
  LOG_DIR: saved_models
  LOG_DIR_NAME: split_by_category/random_forest
