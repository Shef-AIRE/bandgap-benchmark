# DATASET:
#   TRAIN: 'data/ds2.json'
#   VAL: 'data/ds3.json'

DATASET:
  TRAIN: ""
  VAL: ""
  PREDEFINED_SPLIT: True
  SPLIT_GLOB: "data/split_by_category/*.train.json"

MODEL:
  NAME: "cgcnn"
  PRETRAINED_MODEL_PATH: "saved_models/cgcnn/best.ckpt"
  INIT_FILE: "cif_file/atom_init.json"
  CIF_FOLDER: "cif_file"

SOLVER:
  LR: 0.001
  NUM_FOLDS: 10
  EPOCHS: 50
  NUM_RUNS: 1

CGCNN:
  FEATURE_FUSION: "leftnet"
  LAYER_FREEZE: "none"

LOGGING:
  LOG_DIR: "saved_models"
  LOG_DIR_NAME: "split_by_category/cgcnn"
