DATASET:
  TRAIN: ''
  VAL: ''
  PREDEFINED_SPLIT: true
  SPLIT_GLOB: data/domain_split/lomo_split/*.train.json
MODEL:
  NAME: linear_regression
  PRETRAINED_MODEL_PATH: ''
  INIT_FILE: cif_file/atom_init.json
  CIF_FOLDER: cif_file
  HYPERPARAMS:
    SEARCH: grid
    fit_intercept:
    - true
    - false
    positive:
    - true
    - false
SOLVER:
  NUM_FOLDS: 10
  EPOCHS: 100
LOGGING:
  LOG_DIR: saved_models
  LOG_DIR_NAME: split_by_category/linear_regression
