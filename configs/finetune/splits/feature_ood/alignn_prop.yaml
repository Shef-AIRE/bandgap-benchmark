DATASET:
  TRAIN: data/splits_feature_ood/train_data.json
  VAL: data/splits_feature_ood/test_data.json
MODEL:
  NAME: alignn
  PRETRAINED_MODEL_PATH: saved_models/alignn_prop/best-mre-epoch=194-val_mre=0.2759.ckpt
  INIT_FILE: cif_file/atom_init.json
  CIF_FOLDER: cif_file
SOLVER:
  LR: 0.001
  NUM_FOLDS: 10
  EPOCHS: 100
  NUM_RUNS: 1
  BATCH_SIZE: 32
ALIGNN:
  HIDDEN_DIM: 160
  NUM_LAYERS: 6
  NUM_RBF: 64
  DROPOUT: 0.05
  READOUT: mean
  ACTIVATION: silu
  RBF_TRAINABLE: false
  MAX_NEIGHBORS: 1000
  ENCODING: prop
  MAX_NUM_ELEMENTS: 94
LOGGING:
  LOG_DIR: saved_models
  LOG_DIR_NAME: feature_ood/alignn_prop
