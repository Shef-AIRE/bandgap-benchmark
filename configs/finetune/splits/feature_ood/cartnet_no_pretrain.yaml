DATASET:
  TRAIN: data/splits_feature_ood/train_data.json
  VAL: data/splits_feature_ood/test_data.json
MODEL:
  NAME: cartnet
SOLVER:
  LR: 0.001
  NUM_FOLDS: 10
  EPOCHS: 100
CARTNET:
  DIM_IN: 256
  DIM_RBF: 64
  NUM_LAYERS: 4
  INVARIANT: true
  USE_ENVELOPE: true
  ATOM_TYPES: true
  ENCODING: z
LOGGING:
  LOG_DIR: saved_models
  LOG_DIR_NAME: feature_ood/cartnet_no_pretrain
