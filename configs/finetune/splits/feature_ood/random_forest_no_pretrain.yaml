DATASET:
  TRAIN: data/splits_feature_ood/train_data.json
  VAL: data/splits_feature_ood/test_data.json
MODEL:
  NAME: random_forest
  HYPERPARAMS:
    SEARCH: grid
    n_estimators:
      - 200
      - 400
      - 800
    max_depth:
      - null
      - 10
      - 20
    min_samples_split:
      - 2
      - 4
      - 8
    min_samples_leaf:
      - 1
      - 2
      - 4
SOLVER:
  NUM_FOLDS: 10
  EPOCHS: 100
LOGGING:
  LOG_DIR: saved_models
  LOG_DIR_NAME: feature_ood/random_forest_no_pretrain
