DATASET:
  TRAIN: data/splits_feature_ood/train_data.json
  VAL: data/splits_feature_ood/test_data.json
MODEL:
  NAME: linear_regression
  HYPERPARAMS:
    SEARCH: grid
    fit_intercept:
      - true
      - false
    positive:
      - true
      - false
SOLVER:
  NUM_FOLDS: 10
  EPOCHS: 100
LOGGING:
  LOG_DIR: saved_models
  LOG_DIR_NAME: feature_ood/linear_regression
