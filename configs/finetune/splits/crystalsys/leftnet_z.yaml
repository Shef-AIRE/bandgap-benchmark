DATASET:
  TRAIN: ""
  VAL: ""
  PREDEFINED_SPLIT: True
  SPLIT_GLOB: "data/split_json/crystalsys_split/*.train.json"

MODEL:
  NAME: "leftnet"
  PRETRAINED_MODEL_PATH: " "
  INIT_FILE: "cif_file/atom_init.json"
  CIF_FOLDER: "cif_file"

SOLVER:
  LR: 0.001
  NUM_FOLDS: 10
  EPOCHS: 100
  NUM_RUNS: 1
  BATCH_SIZE: 32

LEFTNET:
  ENCODING: "z"
  LAYER_FREEZE: "none"

LOGGING:
  LOG_DIR: "saved_models"
  LOG_DIR_NAME: "crystalsys/leftnet_z"
