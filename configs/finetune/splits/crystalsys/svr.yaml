DATASET:
  TRAIN: ''
  VAL: ''
  PREDEFINED_SPLIT: True
  SPLIT_GLOB: "data/split_json/crystalsys_split/*.train.json"

MODEL:
  NAME: "svm"
  PRETRAINED_MODEL_PATH: ""
  INIT_FILE: "cif_file/atom_init.json"
  CIF_FOLDER: "cif_file"
  HYPERPARAMS:
    SEARCH: grid
    C: [1, 10, 100]
    gamma: [0.01, 0.1, 1]
    epsilon: [0.01, 0.1, 0.5]
    kernel: ['rbf']

SOLVER:
  SEED: 42
  NUM_FOLDS: 10
  EPOCHS: 1
  NUM_RUNS: 1

LOGGING:
  LOG_DIR: "saved_models"
  LOG_DIR_NAME: "split/crystalsys/svr"
