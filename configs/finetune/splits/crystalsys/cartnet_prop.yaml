DATASET:
  TRAIN: ""
  VAL: ""
  PREDEFINED_SPLIT: True
  SPLIT_GLOB: "data/split_json/crystalsys_split/*.train.json"

SOLVER:
  SEED: 42
  EPOCHS: 100
  LR: 0.001
  BATCH_SIZE: 64
  NUM_RUNS: 1
  NUM_FOLDS: 10
  RANDOMIZE: true
  TASK: regression
  DISABLE_CUDA: false
  WORKERS: 4
  START_EPOCH: 0
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.0
  PRINT_FREQ: 10
  RESUME: ''
  OPTIM: SGD

MODEL:
  NAME: cartnet
  PRETRAINED_MODEL_PATH: saved_models/pretrain/cartnet_prop/pretrain-best-mre-epoch=84-val_mre=0.2908.ckpt
  INIT_FILE: cif_file/atom_init.json
  CIF_FOLDER: cif_file
  MAX_NBRS: 12
  RADIUS: 8.0

CARTNET:
  DIM_IN: 256
  DIM_RBF: 64
  NUM_LAYERS: 4
  INVARIANT: true
  USE_ENVELOPE: true
  ATOM_TYPES: true
  ENCODING: "prop"

LOGGING:
  LOG_DIR: saved_models
  LOG_DIR_NAME: crystalsys/cartnet_prop

