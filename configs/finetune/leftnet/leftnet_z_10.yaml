DATASET:
  TRAIN: "data/fine_tune/train_data_10.json"
  VAL: "data/fine_tune/test_data.json"

MODEL:
  NAME: "leftnet"
  PRETRAINED_MODEL_PATH: " "
  INIT_FILE: "cif_file/atom_init.json"
  CIF_FOLDER: "cif_file"

SOLVER:
  LR: 0.001
  NUM_FOLDS: 10
  EPOCHS: 100
  NUM_RUNS: 1
  BATCH_SIZE: 32

LEFTNET:
  ENCODING: "z"
  LAYER_FREEZE: "none"

LOGGING:
  LOG_DIR: "saved_models"
  LOG_DIR_NAME: "leftnet_z_10"
