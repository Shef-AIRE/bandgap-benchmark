DATASET:
  TRAIN: "data/fine_tune/train_data_50.json"
  VAL: "data/fine_tune/test_data.json"

MODEL:
  NAME: "alignn"
  PRETRAINED_MODEL_PATH: "saved_models/alignn/best.ckpt"
  INIT_FILE: "cif_file/atom_init.json"
  CIF_FOLDER: "cif_file"

SOLVER:
  LR: 0.001
  NUM_FOLDS: 10
  EPOCHS: 100
  NUM_RUNS: 1

ALIGNN:
  ENCODING: "z"

LOGGING:
  LOG_DIR: "saved_models"
  LOG_DIR_NAME: "alignn_z_50"
