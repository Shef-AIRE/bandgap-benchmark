DATASET:
  TRAIN: "data/pretrain_data.json"
  VAL: "data/fine_tune/test_data.json"

MODEL:
  NAME: "alignn_old"
  PRETRAINED_MODEL_PATH: ""
  INIT_FILE: "cif_file/atom_init.json"
  CIF_FOLDER: "cif_file"

SOLVER:
  LR: 0.005
  NUM_FOLDS: 10
  EPOCHS: 200
  NUM_RUNS: 1
  BATCH_SIZE: 32

ALIGNN:
  HIDDEN_DIM: 160
  NUM_LAYERS: 6
  NUM_RBF: 64
  DROPOUT: 0.05
  READOUT: "mean"
  ACTIVATION: "silu"
  RBF_TRAINABLE: False
  MAX_NEIGHBORS: 1000
  ENCODING: "z"

LOGGING:
  LOG_DIR: "saved_models"
  LOG_DIR_NAME: "pretrain/alignn_old"

OUTPUT:
  LOOP_RESULTS: "result/alignn_old_pretrain/loop_200epochs.csv"
  PREDICTIONS: "result/alignn_old_pretrain/predict.csv"
