DATASET:
  TRAIN: "data/pretrain_data_old.json"
  VAL: "data/fine_tune/test_data.json"

MODEL:
  NAME: "alignn"
  PRETRAINED_MODEL_PATH: "saved_models/pretrain/alignn_z/best.ckpt"
