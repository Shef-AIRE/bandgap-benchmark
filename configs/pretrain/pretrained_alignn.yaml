DATASET:
  TRAIN: "data/fine_tune/train_data.json"
  VAL: "data/fine_tune/test_data.json"

MODEL:
  NAME: "alignn"
  PRETRAINED_MODEL_PATH: ""
  INIT_FILE: "cif_file/atom_init.json"
  CIF_FOLDER: "cif_file"

SOLVER:
  LR: 0.001
  NUM_FOLDS: 2
  EPOCHS: 2
  NUM_RUNS: 1
  BATCH_SIZE: 32

ALIGNN:
  HIDDEN_DIM: 160
  NUM_LAYERS: 6
  NUM_RBF: 64
  DROPOUT: 0.05
  READOUT: "mean"
  ACTIVATION: "silu"
  RBF_TRAINABLE: False
  MAX_NEIGHBORS: 1000

LOGGING:
  LOG_DIR: "saved_models"
  LOG_DIR_NAME: "pretrain/alignn"

OUTPUT:
  LOOP_RESULTS: "result/alignn_pretrain/loop_200epochs.csv"
  PREDICTIONS: "result/alignn_pretrain/predict.csv"
