DATASET:
  TRAIN: "data/pretrain_data.json"
  VAL: 'data/fine_tune/test_data.json'

MODEL:
  NAME: "cgcnn"
  PRETRAINED_MODEL_PATH: ""
  INIT_FILE: "cif_file/atom_init.json"
  CIF_FOLDER: "cif_file"
  RADIUS: 8.0


SOLVER:
  EPOCHS: 200

CGCNN:
  FEATURE_FUSION: 'none'
  NBR_FEA_LEN: 41

LOGGING:
  LOG_DIR: "saved_models"
  LOG_DIR_NAME: "pretrain/cgcnn"
