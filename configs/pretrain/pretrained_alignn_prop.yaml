DATASET:
  TRAIN: "data/pretrain_data.json"
  VAL: "data/filtered_data/test_data.json"

MODEL:
  NAME: "alignn"
  PRETRAINED_MODEL_PATH: ""
  INIT_FILE: "cif_file/atom_init.json"
  CIF_FOLDER: "cif_file"

SOLVER:
  LR: 0.01
  NUM_FOLDS: 10
  EPOCHS: 200
  NUM_RUNS: 1
  BATCH_SIZE: 32

ALIGNN:
  HIDDEN_DIM: 160
  NUM_LAYERS: 6
  NUM_RBF: 64
  CUTOFF: 8.0
  DROPOUT: 0.05
  READOUT: "mean"
  ACTIVATION: "silu"
  RBF_TRAINABLE: False
  MAX_NEIGHBORS: 1000
  ENCODING: "prop"
  MAX_NUM_ELEMENTS: 94

LOGGING:
  LOG_DIR: "saved_models"
  LOG_DIR_NAME: "pretrain/alignn_prop"

OUTPUT:
  LOOP_RESULTS: "result/alignn_prop_pretrain/loop.csv"
  PREDICTIONS: "result/alignn_prop_pretrain/predict.csv"
